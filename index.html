<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08111f">

<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#070d16;color:#eaf2ff}button,input,textarea,select{font:inherit}button{cursor:pointer}.sidebar{width:250px;position:fixed;inset:0 auto 0 0;background:#0a1422;border-right:1px solid #1c3047;padding:22px;display:flex;flex-direction:column;gap:8px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:25px}.logo{width:45px;height:45px;border:2px solid #5ba8ff;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#7fc0ff}.brand b{font-size:21px}.brand small{display:block;color:#7d91a8;font-size:9px;letter-spacing:2px;margin-top:2px}.nav,.side-bottom button{background:transparent;border:0;color:#9db0c5;text-align:left;padding:13px 12px;border-radius:9px}.nav:hover,.nav.active{background:#10243a;color:white}.side-bottom{margin-top:auto;border-top:1px solid #1c3047;padding-top:14px}.side-bottom span{display:block;color:#7fc0ff;font-size:13px;margin:5px 12px 8px}.side-bottom button{color:#ff8994}.side-bottom button:hover{background:#2a1820}main{margin-left:250px;min-height:100vh}header{height:88px;border-bottom:1px solid #16283c;padding:18px 34px;display:flex;align-items:center;gap:16px;background:#08111c;position:sticky;top:0;z-index:2}#menu{display:none;background:none;border:0;color:white;font-size:22px}.eyebrow{font-size:10px;letter-spacing:2px;color:#6f91b2}h1{margin:3px 0 0;font-size:25px}.status{margin-left:auto;color:#69e09a;font-size:12px}.content,.grid{padding:28px 34px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:#0c1827;border:1px solid #1b3046;border-radius:14px;padding:20px}.card small{color:#8096ad}.number{font-size:32px;font-weight:800;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.panel h2{margin-top:0;font-size:17px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #1b2a3d;color:#cbd8e7}.table th{color:#7189a2;font-size:12px}.primary{background:#2d8cff;color:white;border:0;padding:11px 15px;border-radius:9px;font-weight:700}.danger{background:#a92f3c;color:white;border:0;padding:10px 14px;border-radius:8px}.form{display:grid;gap:11px}.form input,.form textarea,.form select{width:100%;background:#07111d;border:1px solid #294057;color:white;border-radius:8px;padding:11px}.form textarea{min-height:110px;resize:vertical}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#122c45;color:#79bbff;font-size:11px}.agent{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #1a2b3e}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#56d88c;margin-right:7px}.muted{color:#8195aa}.empty{padding:25px;text-align:center;color:#70849a}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:5}.modal>div{background:#0c1827;border:1px solid #294057;border-radius:15px;padding:22px;width:min(520px,100%)}@media(max-width:800px){.sidebar{transform:translateX(-100%);transition:.2s;z-index:4}.sidebar.open{transform:none}main{margin-left:0}#menu{display:block}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}header{padding:15px}.content,.grid{padding:20px}.status{display:none}}

</style>
<title>DBGA Command Center</title>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">DB</div><div><b>DBGA</b><small>COMMAND CENTER</small></div></div>
    <button class="nav active" data-page="dashboard">⌂ Dashboard</button>
    <button class="nav" data-page="reports">▣ Einsatzberichte</button>
    <button class="nav" data-page="cases">▤ Fälle</button>
    <button class="nav" data-page="agents">◉ Agenten</button>
    <button class="nav" data-page="ranking">★ Rangliste</button>
    <div class="side-bottom"><span id="userBadge">Agent</span><button id="logout">Abmelden</button></div>
  </aside>
  <main>
    <header><button id="menu">☰</button><div><span class="eyebrow">DBGA // INTERN</span><h1 id="title">Dashboard</h1></div><span class="status">● SYSTEM ONLINE</span></header>
    <section id="content"></section>
  </main>
</div>
<script>
const state={page:"dashboard",reports:JSON.parse(localStorage.getItem("dbga_reports")||"[]"),cases:JSON.parse(localStorage.getItem("dbga_cases")||"[]"),agents:[
{name:"Yunus",rank:"Leitung",points:120,status:"Online"},{name:"Lian",rank:"Agent",points:80,status:"Offline"},{name:"Suna",rank:"Agent",points:65,status:"Online"},{name:"Noah",rank:"Agent",points:50,status:"Offline"}]};
const $=s=>document.querySelector(s);
function save(){localStorage.setItem("dbga_reports",JSON.stringify(state.reports));localStorage.setItem("dbga_cases",JSON.stringify(state.cases))}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){
 document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));
 const titles={dashboard:"Dashboard",reports:"Einsatzberichte",cases:"Fälle",agents:"Agenten",ranking:"Rangliste"};$("#title").textContent=titles[state.page];
 const c=$("#content"); c.innerHTML="";
 if(state.page==="dashboard") dashboard(c);
 if(state.page==="reports") reports(c);
 if(state.page==="cases") cases(c);
 if(state.page==="agents") agents(c);
 if(state.page==="ranking") ranking(c);
}
function dashboard(c){c.innerHTML=`<div class="content"><div class="cards">
<div class="card"><small>AKTIVE EINSÄTZE</small><div class="number">${state.reports.filter(x=>x.status!=="Abgeschlossen").length}</div></div>
<div class="card"><small>FÄLLE</small><div class="number">${state.cases.length}</div></div>
<div class="card"><small>AGENTEN</small><div class="number">${state.agents.length}</div></div>
<div class="card"><small>SYSTEM</small><div class="number">100%</div></div></div>
<div class="grid"><div class="panel"><h2>Willkommen im DBGA Command Center</h2><p class="muted">Verwalte Einsätze, Fälle und Agenten zentral an einem Ort.</p><button class="primary" onclick="state.page='reports';render()">+ Einsatzbericht erstellen</button></div>
<div class="panel"><h2>Agentenstatus</h2>${state.agents.map(a=>`<div class="agent"><span><i class="dot"></i>${esc(a.name)}</span><span class="muted">${esc(a.rank)}</span></div>`).join("")}</div></div></div>`}
function reports(c){c.innerHTML=`<div class="content"><div class="row"><p class="muted">Alle DBGA-Einsatzberichte</p><button class="primary" onclick="openReport()">+ Neuer Bericht</button></div><div class="panel"><table class="table"><tr><th>EINSATZ</th><th>AGENT</th><th>STATUS</th><th>DATUM</th></tr>${state.reports.length?state.reports.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.agent)}</td><td><span class="tag">${esc(x.status)}</span></td><td>${esc(x.date)}</td></tr>`).join(""):`<tr><td colspan="4" class="empty">Noch keine Einsatzberichte.</td></tr>`}</table></div></div>`}
function cases(c){c.innerHTML=`<div class="content"><div class="row"><p class="muted">DBGA-Fallverwaltung</p><button class="primary" onclick="openCase()">+ Neuer Fall</button></div><div class="panel"><table class="table"><tr><th>FALL</th><th>NR.</th><th>PRIORITÄT</th><th>STATUS</th><th></th></tr>${state.cases.length?state.cases.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.id)}</td><td>${esc(x.priority)}</td><td><span class="tag">${esc(x.status)}</span></td><td><button class="primary" onclick="editCase(${state.cases.indexOf(x)})">Bearbeiten</button></td></tr>`).join(""):`<tr><td colspan="4" class="empty">Noch keine Fälle.</td></tr>`}</table></div></div>`}
function agents(c){c.innerHTML=`<div class="content"><div class="panel"><div class="row"><h2>DBGA-Agenten</h2><button class="primary" onclick="alert('In der nächsten Version: Agent einladen und Account erstellen.')">+ Agent einladen</button></div>${state.agents.map(a=>`<div class="agent"><div><i class="dot" style="background:${a.status==="Online"?"#56d88c":"#68798b"}"></i><b>${esc(a.name)}</b><div class="muted">${esc(a.rank)} · ${a.points} Punkte</div></div><button class="primary" onclick="callAgent('${esc(a.name)}')">📡 Rufen</button></div>`).join("")}</div></div>`}
function ranking(c){const a=[...state.agents].sort((x,y)=>y.points-x.points);c.innerHTML=`<div class="content"><div class="panel"><h2>🏆 DBGA Rangliste</h2><table class="table"><tr><th>RANG</th><th>AGENT</th><th>RANGSTUFE</th><th>PUNKTE</th></tr>${a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.rank)}</td><td>${x.points}</td></tr>`).join("")}</table></div></div>`}
function modal(html){const d=document.createElement("div");d.className="modal";d.innerHTML=`<div>${html}</div>`;document.body.appendChild(d);return d}
function openReport(){const d=modal(`<div class="row"><h2>Neuer Einsatzbericht</h2><button onclick="this.closest('.modal').remove()">✕</button></div><form class="form" id="rf"><input id="rn" placeholder="Einsatzname" required><select id="ra">${state.agents.map(a=>`<option>${esc(a.name)}</option>`).join("")}</select><select id="rs"><option>Offen</option><option>Läuft</option><option>Abgeschlossen</option></select><textarea id="rd" placeholder="Bericht / Notizen"></textarea><button class="primary">Speichern</button></form>`);$("#rf").onsubmit=e=>{e.preventDefault();state.reports.push({name:$("#rn").value,agent:$("#ra").value,status:$("#rs").value,date:new Date().toLocaleDateString("de-DE")});save();d.remove();render()}}
function editCase(i){
 const x=state.cases[i];
 const d=modal(`<div class="row"><h2>Fall bearbeiten</h2><button onclick="this.closest('.modal').remove()">✕</button></div>
 <form class="form" id="ef">
 <input value="${esc(x.name)}" id="en" placeholder="Fallname" required>
 <input value="${esc(x.id)}" id="ei" placeholder="Fallnummer" required>
 <select id="ep"><option ${x.priority==="Niedrig"?"selected":""}>Niedrig</option><option ${x.priority==="Normal"?"selected":""}>Normal</option><option ${x.priority==="Hoch"?"selected":""}>Hoch</option><option ${x.priority==="Dringend"?"selected":""}>Dringend</option></select>
 <select id="es"><option ${x.status==="Offen"?"selected":""}>Offen</option><option ${x.status==="In Bearbeitung"?"selected":""}>In Bearbeitung</option><option ${x.status==="Abgeschlossen"?"selected":""}>Abgeschlossen</option></select>
 <button class="primary">Speichern</button></form>`);
 $("#ef").onsubmit=e=>{e.preventDefault();x.name=$("#en").value;x.id=$("#ei").value;x.priority=$("#ep").value;x.status=$("#es").value;save();d.remove();render()}
}
function openCase(){const d=modal(`<div class="row"><h2>Neuer Fall</h2><button onclick="this.closest('.modal').remove()">✕</button></div><form class="form" id="cf"><input id="cn" placeholder="Fallname" required><input id="ci" placeholder="Fallnummer, z.B. DBGA-001" required><select id="cp"><option>Niedrig</option><option>Normal</option><option>Hoch</option><option>Dringend</option></select><select id="cs"><option>Offen</option><option>In Bearbeitung</option><option>Abgeschlossen</option></select><textarea placeholder="Beschreibung / Notizen"></textarea><button class="primary">Fall erstellen</button></form>`);$("#cf").onsubmit=e=>{e.preventDefault();state.cases.push({name:$("#cn").value,id:$("#ci").value,priority:$("#cp").value,status:$("#cs").value});save();d.remove();render()}}
function callAgent(name){alert(`📡 Agent ${name} wurde gerufen.\n\nEchte Benachrichtigungen zwischen Geräten bauen wir im nächsten Schritt mit der Online-Datenbank ein.`)}
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render();document.querySelector(".sidebar").classList.remove("open")});
$("#logout").onclick=()=>alert("Der echte Agenten-Login kommt mit der Online-Version.");
$("#menu").onclick=()=>document.querySelector(".sidebar").classList.toggle("open");
render();

</script>
</body>
</html>
